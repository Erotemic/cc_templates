<svg xmlns="http://www.w3.org/2000/svg" width="512" height="768" viewBox="0 0 512 768">
  <!--
    Moon Mage

    Faithful vector port of the classroom PIL design in moon_mage_pil.py.
    The groups are intentionally named after visible character parts so a
    student can edit one idea at a time. Major silhouettes use SVG paths.
  -->
  <g id="moon-mage" stroke="#18152a" stroke-linejoin="round" stroke-linecap="round">

    <!-- Soft halo approximated with transparent circles so the SVG stays
         compatible with pygame / SDL_image without requiring SVG filters. -->
    <g id="halo" stroke="none" fill="#64b4ff">
      <circle cx="264" cy="240" r="130" opacity="0.07"/>
      <circle cx="264" cy="240" r="100" opacity="0.09"/>
      <circle cx="264" cy="240" r="72" opacity="0.13"/>
    </g>

    <ellipse id="ground-shadow" cx="260.5" cy="719" rx="118.5" ry="19"
             fill="#0c0a18" opacity="0.22" stroke="none"/>

    <g id="staff">
      <path d="M389 192 L366 655" fill="none" stroke="#18152a" stroke-width="15"/>
      <path d="M389 192 L366 655" fill="none" stroke="#5c4970" stroke-width="10"/>
      <path d="M386 204 L370 640" fill="none" stroke="#8f7aad" stroke-width="3"/>

      <!-- Crescent: outer ellipse minus the offset inner ellipse. -->
      <path d="M382.5 92
               A47.5 49 0 1 1 382.5 190
               A47.5 49 0 1 1 382.5 92 Z
               M394 104
               A37 35 0 1 0 394 174
               A37 35 0 1 0 394 104 Z"
            fill="#f5f1d2" fill-rule="evenodd" stroke="none"/>
      <path d="M382.5 92 A47.5 49 0 1 1 382.5 190 A47.5 49 0 1 1 382.5 92 Z"
            fill="none" stroke="#18152a" stroke-width="4"/>
      <path d="M389.8 104.2 A37 35 0 0 1 389.5 173.7"
            fill="none" stroke="#18152a" stroke-width="4"/>

      <g id="staff-orb">
