        <circle cx="385" cy="136" r="20" fill="#6ed2ff" opacity="0.18" stroke="none"/>
        <circle cx="385" cy="136" r="12" fill="#6ed2ff" opacity="0.28" stroke="none"/>
        <ellipse cx="385" cy="136" rx="11" ry="11" fill="#87dcff" stroke="#18152a" stroke-width="3"/>
      </g>
    </g>

