[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpg-battle"
version = "0.1.0"
description = "Procedural pygame fantasy battle project for teaching Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame>=2.5", "numpy>=1.24", "loguru>=0.7", "rich>=13.7"]

[project.optional-dependencies]
classroom = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
rpg-battle = "rpg_battle.__main__:main"
rpg-battle-render-character = "rpg_battle.cli.render_character:main"
rpg-battle-render-state = "rpg_battle.cli.render_battle_state:main"
rpg-battle-render-audio = "rpg_battle.cli.render_audio:main"
rpg-battle-render-effect = "rpg_battle.cli.render_effect:main"
rpg-battle-lab = "rpg_battle.teaching.lab:main"
rpg-battle-simulate = "rpg_battle.teaching.simulate:main"

[tool.setuptools]
package-dir = {"" = "src", "student_game" = "student_game"}

[tool.setuptools.packages.find]
where = ["src", "."]
namespaces = false
include = ["rpg_battle*", "student_game*"]

[tool.setuptools.package-data]
rpg_battle = ["assets/audio/*"]
student_game = ["README.md"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
