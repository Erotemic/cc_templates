[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpx3d"
version = "0.1.0"
description = "A bright first-person 3D Python game template for students."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "panda3d>=1.10.15",
]

[project.scripts]
fpx3d = "fpx3d.game:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fpx3d*"]
