[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpx3d"
version = "0.1.0"
description = "Prism Vault: a playable first-person Panda3D game with guided missions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "panda3d>=1.10.15",
]

[project.scripts]
fpx3d = "fpx3d.launch:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fpx3d*"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
