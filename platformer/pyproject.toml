[project]
name = "platformer"
version = "0.2.0"
description = "A tiny classroom platformer with two guided Python missions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5.0"]

[project.scripts]
platformer = "platformer:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "platformer"
module-root = ""
